name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Version Consistency
        run: node scripts/check-version.mjs

  verify:
    name: Verify (${{ matrix.os }})
    needs: [version-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Cargo clippy (workspaces)
        run: cargo clippy -- -D warnings

      - name: Cargo clippy (app shell)
        run: cargo clippy -p exam-panel-app -- -D warnings

      - name: Cargo tests
        run: cargo test

      - name: Verify TypeScript typegen freshness
        shell: bash
        run: |
          pnpm typegen
          git diff --exit-code ui/src/lib/api/generated/

      - name: UI lint
        run: pnpm -C ui lint

      - name: UI typecheck
        run: pnpm -C ui typecheck

      - name: UI tests
        run: pnpm -C ui test

      - name: UI build
        run: pnpm -C ui build

      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: pnpm -C ui exec playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        if: runner.os == 'Linux'
        run: pnpm -C ui test:e2e
