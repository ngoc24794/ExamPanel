[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/service",
    "src-tauri",
]
default-members = [
    "crates/core",
    "crates/storage",
    "crates/service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ExamPanel Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
exam-panel-core = { path = "crates/core" }
exam-panel-storage = { path = "crates/storage" }
exam-panel-service = { path = "crates/service" }
calamine = "0.26"
rust_xlsxwriter = "0.99"
unicode-normalization = "0.1"
log = "0.4"
