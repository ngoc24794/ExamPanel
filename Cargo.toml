[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "src-tauri",
]
default-members = [
    "crates/core",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ExamPanel Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
exam-panel-core = { path = "crates/core" }
exam-panel-storage = { path = "crates/storage" }
