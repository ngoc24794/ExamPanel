[package]
name = "exam-panel-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
dev-tools = ["dep:ts-rs"]

[dependencies]
exam-panel-core = { workspace = true }
exam-panel-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }

[dev-dependencies]
exam-panel-service = { path = ".", features = ["dev-tools"] }
tempfile = "3.17"
ts-rs = { version = "12", features = ["serde-compat"] }
