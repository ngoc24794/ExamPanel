[package]
name = "exam-panel-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "exam_panel_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# Release builds must NOT ship dev-tools (seed_demo writes demo data into the real DB).
# Enable explicitly for development: `pnpm tauri dev --features dev-tools`.
default = []
dev-tools = ["exam-panel-service/dev-tools"]

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
exam-panel-core = { workspace = true }
exam-panel-storage = { workspace = true }
exam-panel-service = { workspace = true }
