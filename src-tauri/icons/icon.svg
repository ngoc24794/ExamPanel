<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Document Shadow -->
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Fold Corner Shadow -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Panel Dots Gradients -->
    <linearGradient id="setter1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="setter2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="reviewerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="none" stroke="#334155" stroke-width="12" />

  <!-- Document Sheet with folded top-right corner -->
  <g filter="url(#docShadow)">
    <!-- Main Sheet Path (folded top-right corner: 220,160 to 660,160 then 804,304 down to 804,820 to 220,820) -->
    <path d="M 240 180
             L 660 180
             L 784 304
             L 784 820
             A 28 28 0 0 1 756 848
             L 268 848
             A 28 28 0 0 1 240 820
             Z"
          fill="url(#sheetGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 660 180
             L 660 280
             A 24 24 0 0 0 684 304
             L 784 304
             Z"
          fill="url(#foldGrad)" />
  </g>

  <!-- Sheet Content Lines -->
  <rect x="320" y="270" width="280" height="24" rx="12" fill="#cbd5e1" />
  <rect x="320" y="330" width="180" height="20" rx="10" fill="#e2e8f0" />

  <!-- Bold Central Checkmark (Validated Panel) -->
  <path d="M 370 490
           L 465 585
           L 665 385"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="54"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Panel Connection Bar -->
  <path d="M 360 720 L 664 720" stroke="#cbd5e1" stroke-width="14" stroke-dasharray="8 8" stroke-linecap="round" />

  <!-- 3 Panel Member Badges: 2 Setters (Ra đề) + 1 Reviewer (Phản biện) -->
  <!-- Setter 1 (Left) -->
  <g transform="translate(360, 720)">
    <circle cx="0" cy="0" r="46" fill="url(#setter1Grad)" stroke="#ffffff" stroke-width="8" />
    <path d="M -16 6 L -6 16 L 16 -6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Setter 2 (Center) -->
  <g transform="translate(512, 720)">
    <circle cx="0" cy="0" r="46" fill="url(#setter2Grad)" stroke="#ffffff" stroke-width="8" />
    <path d="M -16 6 L -6 16 L 16 -6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Reviewer (Right) -->
  <g transform="translate(664, 720)">
    <circle cx="0" cy="0" r="46" fill="url(#reviewerGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Magnifier / Reviewer Icon -->
    <circle cx="-3" cy="-3" r="16" fill="none" stroke="#ffffff" stroke-width="6" />
    <line x1="8" y1="8" x2="20" y2="20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
